name: FEXCore PPA-flavor Stable

# Builds a "PPA-flavor" wcp of a FEX-Emu stable tag (default FEX-2605),
# matching the actual fex-emu-wine PPA build flavor as discovered by
# inspecting DWARF metadata on the PPA wcp:
#   - CMAKE_BUILD_TYPE=Release          (Release-optimised C++ — no debug info)
#   - CMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g"
#                                        (debug info ONLY for C files —
#                                         Musl CRT, softfloat, cephes, rpmalloc,
#                                         xxhash, tiny-json. The PPA wcp had
#                                         88 CUs, all .c, no C++.)
#   - No llvm-strip step                (preserves the C-file debug info)
#   - CMAKE_INSTALL_LIBDIR=/            (bakes "//fex-emu/HostThunks" path,
#                                        matching the PPA install layout)
#   - profile.json mirrors PPA byte-for-byte
#     (versionName="2605", versionCode=0, no author,
#      description="FEXCore Release from PPA")

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'FEX-Emu stable tag to build (e.g. FEX-2605, FEX-2606)'
        required: false
        default: 'FEX-2605'

jobs:
  # ==================================================================
  # JOB 1: FEXCore Build — PPA flavor
  # ==================================================================
  build-fex-ppa:
    name: Build FEXCore (PPA flavor)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      commit_full: ${{ steps.version.outputs.commit_full }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils jq git zip \
            build-essential python3 pkg-config cmake zstd \
            dos2unix perl tar unzip meson ninja-build wget

      - name: Setup GLSLANG
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup Toolchain
        run: |
          # Use bylaws/llvm-mingw 20250920 — the exact toolchain the FEX-Emu
          # Launchpad PPA builds with (confirmed via DW_AT_producer in the
          # PPA wcp: "clang 21.1.0 (bylaws/llvm-project ...)" and the comp_dir
          # path "llvm-mingw-20250920-ucrt-ubuntu-22.04-aarch64").
          LLVM_MINGW_TAG="20250920"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/bylaws/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Clone and checkout target tag
        run: |
          git clone --recursive https://github.com/FEX-Emu/FEX.git source
          cd source
          TARGET_TAG="${{ github.event.inputs.tag }}"
          echo "Checking out tag: $TARGET_TAG"
          git fetch --all --tags
          git checkout "$TARGET_TAG"
          git submodule update --init --recursive

      - name: Determine version label
        id: version
        run: |
          cd source
          COMMIT_FULL=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TAG_NAME="${{ github.event.inputs.tag }}"

          # "FEX-2605" -> "2605" for profile.json versionName (mirrors PPA exactly)
          VERSION_SHORT="${TAG_NAME#FEX-}"

          # File-stem follows the user's existing convention: FEXCore-2605-PPA.wcp
          FILE_STEM="FEXCore-${VERSION_SHORT}-PPA"

          {
            echo "VERSION_SHORT=${VERSION_SHORT}"
            echo "FILE_STEM=${FILE_STEM}"
            echo "TAG_NAME=${TAG_NAME}"
          } >> $GITHUB_ENV

          echo "version=${VERSION_SHORT}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}"          >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHORT}"   >> $GITHUB_OUTPUT
          echo "commit_full=${COMMIT_FULL}" >> $GITHUB_OUTPUT

          echo "Building PPA flavor: ${FILE_STEM} (tag=${TAG_NAME}, sha=${COMMIT_FULL})"

      - name: Build FEX (RelWithDebInfo, PPA install paths)
        run: |
          cd source

          build_arch() {
            local triple="$1"
            local build_dir="build-${triple}"

            rm -rf "$build_dir" && mkdir "$build_dir" && cd "$build_dir"
            # Differences vs nightly workflow:
            #   - Release + CFLAGS_RELEASE adds "-g"  -> debug info only for C
            #     files (Musl CRT, softfloat, cephes, rpmalloc, xxhash,
            #     tiny-json). C++ stays Release. This is what the PPA wcp
            #     actually does — confirmed via DWARF inspection of FEX-2604-PPA.
            #   - INSTALL_LIBDIR=/                    -> bakes "//fex-emu/HostThunks"
            #     (matches the FEX Launchpad PPA build; nightly bakes
            #      /usr/lib/wine/aarch64-windows/fex-emu/HostThunks)
            #   - we deliberately do NOT run `ninja install`: CMake rejects the
            #     resulting "//share/fex-emu/AppConfig" path under DESTDIR as a
            #     network path. The DLL is grabbed directly from build/Bin/.
            cmake -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
              -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/ \
              -DCMAKE_INSTALL_LIBDIR=/ \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
              -DTUNE_ARCH=generic -DTUNE_CPU=none \
              ..
            ninja -j 2
            cd ..
          }

          build_arch "arm64ec"
          build_arch "aarch64"

      - name: Verify PPA-flavor traits
        run: |
          cd source
          DLL_EC=$(find build-arm64ec/Bin -type f -name 'libarm64ecfex.dll' | head -n 1)
          DLL_WOW=$(find build-aarch64/Bin -type f -name 'libwow64fex.dll'  | head -n 1)
          echo "DLL_EC=$DLL_EC"
          echo "DLL_WOW=$DLL_WOW"
          test -f "$DLL_EC"  || (echo "FAIL: arm64ec DLL not found" && exit 1)
          test -f "$DLL_WOW" || (echo "FAIL: wow64 DLL not found"   && exit 1)

          echo "=== HostThunks path baked into libwow64fex ==="
          if strings "$DLL_WOW" | grep -E '//fex-emu/HostThunks'; then
            echo "OK: PPA-style path present"
          else
            echo "WARN: expected //fex-emu/HostThunks not found — printing actual:"
            strings "$DLL_WOW" | grep -E 'fex-emu/HostThunks' || true
          fi

          echo "=== Debug sections in libwow64fex (expect .debug_*) ==="
          /opt/llvm-mingw/bin/llvm-objdump -h "$DLL_WOW" | grep '\.debug_' \
            && echo "OK: debug sections preserved" \
            || (echo "FAIL: no debug sections present" && exit 1)

          echo "=== Debug sections in libarm64ecfex (expect .debug_*) ==="
          /opt/llvm-mingw/bin/llvm-objdump -h "$DLL_EC"  | grep '\.debug_' \
            && echo "OK: debug sections preserved" \
            || (echo "FAIL: no debug sections present" && exit 1)

      - name: Package (no strip)
        run: |
          rm -rf final_package && mkdir -p final_package/system32

          DLL_EC=$(find source/build-arm64ec/Bin -type f -name 'libarm64ecfex.dll' | head -n 1)
          DLL_WOW=$(find source/build-aarch64/Bin -type f -name 'libwow64fex.dll'  | head -n 1)

          cp "$DLL_EC"  final_package/system32/libarm64ecfex.dll
          cp "$DLL_WOW" final_package/system32/libwow64fex.dll
          # NOTE: deliberately no llvm-strip — the whole point of the PPA flavor
          # is preserving the .debug_* sections and full symbol table.

          # profile.json — byte-for-byte mirror of the FEX-Emu PPA wcp metadata.
          cat > final_package/profile.json << EOF
          {
            "type": "FEXCore",
            "versionName": "${VERSION_SHORT}",
            "versionCode": 0,
            "description": "FEXCore Release from PPA",
            "files": [
              {
                "source": "system32/libarm64ecfex.dll",
                "target": "\${system32}/libarm64ecfex.dll"
              },
              {
                "source": "system32/libwow64fex.dll",
                "target": "\${system32}/libwow64fex.dll"
              }
            ]
          }
          EOF

          cd final_package
          tar -cJf "../${FILE_STEM}.wcp" .
          zip  -r  "../${FILE_STEM}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: fex-ppa-stable
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 2: Release (standalone, separate from nightly tag namespace)
  # ==================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-fex-ppa]
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Set Release Variables
        run: |
          TAG="${{ needs.build-fex-ppa.outputs.tag }}"
          SHA="${{ needs.build-fex-ppa.outputs.commit }}"
          echo "REL_TAG=fexcore-ppa-${TAG}-${SHA}" >> $GITHUB_ENV
          echo "REL_NAME=FEXCore PPA-flavor Stable - ${TAG}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_NAME }}
          prerelease: false
          make_latest: false
          body: |
            ### FEXCore PPA-flavor Stable: `${{ needs.build-fex-ppa.outputs.tag }}`

            A pixel-perfect reproduction of the **fex-emu-wine PPA** build flavor
            for stable tag [`${{ needs.build-fex-ppa.outputs.tag }}`](https://github.com/FEX-Emu/FEX/releases/tag/${{ needs.build-fex-ppa.outputs.tag }})
            (commit [`${{ needs.build-fex-ppa.outputs.commit }}`](https://github.com/FEX-Emu/FEX/commit/${{ needs.build-fex-ppa.outputs.commit_full }})).

            #### What's special about the "PPA flavor"?

            The Launchpad PPA (`ppa:fex-emu/fex` → `fex-emu-wine` package) ships
            a wcp with a build configuration that differs from FEX upstream's
            own GitHub Actions wine_build workflow:

            | Trait | This wcp / Original PPA wcp | Stripped nightly wcp |
            | :--- | :--- | :--- |
            | HostThunks path baked in | `//fex-emu/HostThunks` | `/usr/lib/wine/aarch64-windows/fex-emu/HostThunks` |
            | DWARF debug sections | **Present** | None (stripped) |
            | DWARF coverage | **Only C runtime helpers** (Musl CRT, softfloat, cephes, rpmalloc, xxhash, tiny-json) — ~88 CUs, 0 C++ | n/a |
            | FEX C++ JIT code | Release-optimised, no debug info | Release-optimised, no debug info |
            | Approx DLL size | ~5 MB each | ~3.6 MB each |

            #### Toolchain

            - **`bylaws/llvm-mingw` release [`20250920`](https://github.com/bylaws/llvm-mingw/releases/tag/20250920)**
              — clang 21.1.0 from `bylaws/llvm-project` (FEX maintainer's LLVM
              fork with ARM64EC/wow64 patches not yet in mainline). Calibrated
              to land within −0.16% of the original FEX-2604 PPA wcp; same
              workflow used for all stable tags.

            #### Build recipe

            ```cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g"   # debug info only for C
            -DCMAKE_INSTALL_PREFIX=/                     # bakes "//fex-emu/HostThunks"
            -DCMAKE_INSTALL_LIBDIR=/
            -DTUNE_ARCH=generic -DTUNE_CPU=none          # generic codegen, no host leak
            -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False
            ```

            DLLs taken straight from `build-${triple}/Bin/` — no `llvm-strip`,
            no `ninja install` (CMake refuses the `//share/...` paths under
            DESTDIR).

            #### Why ship this flavor at all?

            You get crash-grade backtraces with file:line if something explodes
            inside the C math/runtime helpers (numerically-suspect zone), without
            paying the size cost of full DWARF on the C++ JIT (which would
            balloon the wcp from ~5 MB to ~37 MB for no practical debugging
            benefit — those code paths are mature).

            #### How we discovered the recipe

            `llvm-dwarfdump` on the original `FEXcore-2604-PPA.wcp` revealed:
            - `DW_AT_comp_dir` = `/usr/src/fex-emu-wine-2604~q/build_wow64`
            - `DW_AT_producer` = clang from `bylaws/llvm-project`
            - `DW_AT_language` = `DW_LANG_C11` on every CU
            - 88 compile units, **all `.c` files**, none from FEX's C++ codebase

            That language-and-file pattern is only possible if `-g` was passed
            to the C compiler but not to C++ — i.e. `CFLAGS=-g` on Release mode.

            ### Files
            - `FEXCore-*-PPA.wcp` — Winlator component package
            - `FEXCore-*-PPA.zip` — manual injection format (GameHub)
          files: |
            ./artifacts/*.wcp
            ./artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
